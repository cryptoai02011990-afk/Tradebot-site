<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=http://myemabot.duckdns.org">
<title>MYEMA BOT — Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f14;
    color: #fbbf24;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    text-align: center;
  }
  .logo {
    width: 80px; height: 80px;
    border-radius: 20px;
    background: #fbbf24;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: #0b0f14;
    font-size: 2em;
    box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
  }
  h1 { font-size: 1.6em; font-weight: 700; letter-spacing: 1px; }
  .subtitle { color: #9ca3af; font-size: 0.9em; max-width: 400px; line-height: 1.5; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(251, 191, 36, 0.15);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    background: #fbbf24;
    color: #0b0f14;
    padding: 14px 32px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1em;
    text-decoration: none;
    margin-top: 8px;
  }
  .small { color: #6b7280; font-size: 0.75em; margin-top: 20px; }
</style>
</head>
<body>
  <div class="logo">MB</div>
  <h1>MYEMA BOT</h1>
  <div class="subtitle">Automated crypto trading on your own server</div>
  <div class="spinner"></div>
  <div class="subtitle" id="status">Opening dashboard...</div>
  <a class="btn" href="http://myemabot.duckdns.org">Open Dashboard</a>
  <div class="small">If the dashboard doesn't load automatically, tap the button above.</div>
<script>
  setTimeout(function() {
    document.getElementById('status').textContent = 'Redirecting...';
    window.location.replace('http://myemabot.duckdns.org');
  }, 800);
</script>
</body>
</html>
